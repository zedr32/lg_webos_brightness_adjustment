# =============================================================================
# screen_brightness.py — configuration file
# =============================================================================
# This script dynamically adjusts your LG TV's backlight in real time based
# on the average luminance of your PC's screen output. Optionally it also
# adjusts the ceiling using a room light sensor via Home Assistant.
#
# REQUIREMENTS
#   pip install mss numpy requests websockets
#
# FIRST RUN
#   Leave client_key blank below. On first run the script will connect to
#   your TV, show a pairing prompt on screen, and write the key here
#   automatically once you accept. You only need to do this once.
#
#   If the TV ever rejects the stored key (e.g. after a TV factory reset),
#   just clear client_key and run again to re-pair.
# =============================================================================

[tv]

# IP address(es) of your LG TV on your local network.
# If your TV has both wired and wireless connections (or you are unsure which
# is active), list both separated by a comma. The script tries each in order
# and uses whichever responds first.
# Find IPs in your router/Unifi client list, or on the TV under
# Settings > Connection > Network Connection Settings > Wired/Wi-Fi > IP Address
# Examples:
#   ip = 192.168.1.251                      (single IP)
#   ip = 192.168.1.251, 192.168.1.122

# Last IP that successfully connected -- written automatically by the script.
# On startup the script tries this address first to avoid slow timeouts.
# Do not edit manually.
last_ip =       (wired first, WiFi fallback)
ip = 192.168.1.251, 192.168.1.122

# Pairing key — leave blank on first run.
# The script will pair with the TV and write the key here automatically.
# Do not share this key publicly (treat it like a password).
client_key =


[home_assistant]

# Set to true if you have Home Assistant with a lux (light level) sensor.
# When enabled, the script reads room brightness and adjusts the backlight
# ceiling accordingly — dim room means lower max backlight, bright room
# means higher max backlight.
#
# Set to false to skip HA entirely. The script will use a fixed backlight
# ceiling (FALLBACK_CEILING in the script) and only adjust based on
# screen content.
enabled = true

# Full URL to your Home Assistant instance, including port.
# Examples:
#   http://192.168.1.149:8123       (local network, no SSL)
#   https://homeassistant.local     (local with SSL)
#   https://your-ha.duckdns.org     (remote access)
url = http://192.168.1.149:8123

# Long-lived access token for authenticating with Home Assistant.
# To create one:
#   1. Open Home Assistant in your browser
#   2. Click your profile picture (bottom-left)
#   3. Scroll down to "Long-Lived Access Tokens"
#   4. Click "Create Token", give it a name, copy the token and paste it here
# Keep this secret — it grants full access to your HA instance.
token =

# Entity ID of your ambient light sensor in Home Assistant.
# This must be a sensor that reports lux values (numeric, 0 and up).
# Examples:
#   sensor.athom_workshop_presence_light_sensor
#   sensor.living_room_illuminance
#   sensor.zigbee_motion_lux
# Find entity IDs in HA under Settings > Devices & Services > Entities.
light_entity = sensor.athom_workshop_presence_light_sensor

# Entity ID of your LG TV in Home Assistant (media_player type).
# Used to detect when the TV turns off so the script can stop gracefully.
# Find it in HA under Settings > Devices & Services > Entities,
# filter by domain: media_player.
# Example: media_player.lg_webos_tv_oled77c6psa_aauqljd
tv_entity = media_player.lg_webos_tv_oled77c6psa_aauqljd
